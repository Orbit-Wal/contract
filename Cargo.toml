[workspace]
resolver = "2"
members = [
    "contracts/globe-wallet",
    "contracts/token-wrapper",
]

[workspace.dependencies]
# NOTE: do not add `features = ["testutils"]` here — each contract already
# re-adds it correctly under its own [dev-dependencies]. Enabling it on the
# base dependency leaks std-only testutils code (rand, serde_json) into the
# release/wasm32 build, which cannot compile it, breaking every deploy build.
# Pin to 21.7.7 is currently unreviewed drift. Not yet evaluated for upgrade to 27.x.
# Requires careful migration testing due to protocol coupling and security-relevant fixes.
soroban-sdk = { version = "21.7.7" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
